[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tic-crawler"
version = "0.1.0"
description = "Deterministic crawler that catalogs Transparency in Coverage machine-readable files in Google Drive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "ijson>=3.3",
  "jsonschema>=4.22",
  "typer>=0.12",
  "pyyaml>=6.0",
  "google-api-python-client>=2.130",
  "google-auth>=2.29",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.16"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
tic-crawler = "tic_crawler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tic_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["tic_crawler"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
