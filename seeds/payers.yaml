    landing_url: https://bcbsks.com/mrf
    toc_url: https://mrf.secure.bcbsks.com/api/filedownloadhttptrigger?name=table-of-contents&ext=json
    verified_on: 2026-10-29
    verified_by: page_fetch
    notes: TOC endpoint returns a Cloudflare challenge (403) to automated clients (2026-10-29). Save it from a browser to manual_tocs/bcbs-kansas.json and set toc_file.

