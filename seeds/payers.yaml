# TiC payer seed file. Maintained by hand.
#
# Fields: payer_id, legal_name, aliases, hios_ids, states, kind (issuer|tpa), landing_url,
#         toc_url (literal, or a pattern like https://x/{date:%Y-%m}-01_index.json),
#         toc_link_pattern (regex for TOC links on landing_url when names change monthly),
#         toc_file (a TOC saved by hand under manual_tocs/, for sites that block bots),
#         verified_on, verified_by, notes.
#
# verified_by:
#   page_fetch  - landing page fetched on verified_on and the TOC link read from it.
#   http        - URL checked by `tic-crawler verify-seeds` from the crawler host.
#   manual      - TOC saved by hand into manual_tocs/ because the site blocks automated access.
#   none        - not yet checked. Do not crawl until verified.
# A payer that publishes several TOCs gets one entry per TOC.
#
# 2026-10-29: the build sandbox had no outbound access to payer hosts, so nothing here is
# verified_by: http yet. Run `tic-crawler verify-seeds` and update this file.

payers:
