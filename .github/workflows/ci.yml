name: ci
on:
  push:
    paths-ignore: ["dashboard/data/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -coverprofile=cover.out ./...
      - name: Coverage gate on extraction, crosswalk, validation and TOC parsing
        run: |
          go test -cover ./internal/extract ./internal/quality ./internal/validate ./internal/pipeline | tee cov.txt
          awk '/coverage:/ { sub("%","",$5); if ($5+0 < 80) { print "below 80%: " $2; bad=1 } } END { exit bad }' cov.txt
