name: dry-run
# Hands-free dry run: local storage only, HEAD requests only, no Google credentials.
# State and outputs accumulate on the `data` branch, which the dashboard reads.
on:
  workflow_dispatch:
    inputs:
      payers:
        description: "Space-separated payer ids"
        required: true
        default: "bcbs-michigan-group bcbs-michigan-employer bcbs-mississippi bcbs-mississippi-state-employees bcbs-kansas centene-ambetter centene-fidelis centene-health-net qualchoice"
  push:
    branches: [main]
    paths: [".github/workflows/dry-run.yml", "seeds/payers.yaml"]

permissions:
  contents: write

concurrency:
  group: tic-data
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TIC_CONTACT_EMAIL: ${{ secrets.TIC_CONTACT_EMAIL || 'chris@thechrisoneil.com' }}
      PAYERS: ${{ github.event.inputs.payers || 'bcbs-michigan-group bcbs-michigan-employer bcbs-mississippi bcbs-mississippi-state-employees bcbs-kansas centene-ambetter centene-fidelis centene-health-net qualchoice' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: scripts/data_branch.sh restore
      - run: tic-crawler discover --source seed
      - name: Crawl
        run: |
          args=""
          for p in $PAYERS; do args="$args --payer $p"; done
          tic-crawler crawl $args
      - run: tic-crawler audit-access
      - run: tic-crawler export-dashboard
      - run: tic-crawler report
      - name: Publish to data branch
        if: always()
        run: scripts/data_branch.sh publish "dry run ${{ github.run_id }}"
