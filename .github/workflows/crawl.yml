name: crawl
# Weekly. Payers update monthly until 2027-03-06 and quarterly after (CMS-9882-F);
# unchanged TOCs are skipped by SHA-256, so extra runs are cheap.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      payer:
        description: "Crawl one payer id instead of --all"
        required: false

permissions:
  contents: write

concurrency:
  group: tic-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TIC_DRIVE_FOLDER_ID: ${{ secrets.TIC_DRIVE_FOLDER_ID }}
      TIC_CONTACT_EMAIL: ${{ secrets.TIC_CONTACT_EMAIL || 'chris@thechrisoneil.com' }}
      TIC_RAW_STORE: ${{ secrets.TIC_RAW_STORE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/tic-sa.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Restore state and outputs from the data branch
        run: scripts/data_branch.sh restore
      - name: Write service account key
        if: env.TIC_DRIVE_FOLDER_ID != ''
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - run: tic-crawler discover
      - name: Crawl
        run: |
          if [ -n "${{ github.event.inputs.payer }}" ]; then
            tic-crawler crawl --payer "${{ github.event.inputs.payer }}"
          else
            tic-crawler crawl --all
          fi
      - name: Sync to Drive
        if: env.TIC_DRIVE_FOLDER_ID != ''
        run: tic-crawler sync-drive
      - run: tic-crawler audit-access
      - run: tic-crawler export-dashboard
      - run: tic-crawler report
      - name: Publish to data branch
        if: always()
        run: scripts/data_branch.sh publish "weekly crawl ${{ github.run_id }}"
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: out/runs/
      - name: Remove key
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
