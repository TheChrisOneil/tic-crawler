# tic-crawler runtime configuration. Secrets and IDs come from the environment (see .env.example).

[schema]
# Pinned CMS price-transparency-guide release. Schemas are embedded from internal/schemas/v<version>/.
version = "2.2.1"
max_errors_per_toc = 50

[http]
requests_per_second_per_host = 1.0
concurrency = 8
timeout_seconds = 60
max_retries = 5
backoff_base_seconds = 1.0
backoff_max_seconds = 60

[limits]
# A TOC larger than this is skipped and logged.
max_toc_bytes = 2_147_483_648
# Hard cap on raw MRF bytes per run (--download-raw). Above this the run stops and asks.
max_run_bytes = 10_737_418_240

[schedule]
# Regulatory cadence: monthly updates, quarterly from 2027-03-06 (CMS-9882-F).
quarterly_from = "2027-03-06"
stale_days_monthly = 35
stale_days_quarterly = 100
# Root .txt discovery file becomes required on this date.
root_txt_from = "2027-09-06"
# Skip payers crawled more recently than this (weekly schedule, cheap repeats).
min_recrawl_days = 6

[discovery]
seed_file = "seeds/payers.yaml"
# CMS Exchange Machine-Readable URL PUF (issuer IDs, names, states). Zip or CSV.
exchange_puf_url = "https://download.cms.gov/marketplace-puf/2026/machine-readable-url-puf.zip"
exchange_puf_max_bytes = 524_288_000
root_txt_filename = "price-transparency.txt"

[output]
local_dir = "out"
state_db = "state/tic.sqlite"
sheet_name = "TiC Payer Registry"
manifest_plan_name_cap = 50

[reference]
# CMS reference data for the price-quality join (Go `reference` and `crosswalk` commands).
states = ["MA", "NH"]
# Page that links the monthly NPPES full replacement file.
nppes_index_url = "https://download.cms.gov/nppes/NPI_Files.html"
nppes_max_bytes = 2_147_483_648
# NPI Registry API, used for facility NPIs found in price files (and when the bulk file is down).
npi_api_url = "https://npiregistry.cms.hhs.gov/api/?version=2.1&number="
npi_lookup_max = 3000
# CMS Provider Data Catalog (data.cms.gov/provider-data) datasets: id = words its title must contain.
# The command fails if a title no longer matches, so a reused or renamed id cannot slip through.
provider_data_api = "https://data.cms.gov/provider-data/api/1/metastore/schemas/dataset/items/"
[reference.datasets]
xubh-q36u = "hospital general information"
ynj2-r877 = "complications and deaths"
77hc-ibv8 = "healthcare associated infections"
dgck-syfz = "hcahps"
632h-zaca = "unplanned hospital visits"
yv7e-xc69 = "timely and effective care"
27ea-46a8 = "facility affiliation"
# Doctors and Clinicians National Downloadable File: clinician NPIs, practice addresses, states.
mj5m-pzi6 = "national downloadable file"
# Medicare fee schedules used as price benchmarks (`reference medicare`, `report-card`).
# Update each quarter. The CMS pages link these through a license page (apps/ama/license.asp);
# the files themselves are at /files/zip/. Neither amount is wage-adjusted.
[reference.medicare]
# Hospital outpatient (OPPS) Addendum B: national unadjusted payment rate by HCPCS.
# Page: https://www.cms.gov/medicare/payment/prospective-payment-systems/hospital-outpatient-pps/quarterly-addenda-updates
opps_url = "https://www.cms.gov/files/zip/October-2026-OPPS-Addendum-B.zip"
opps_release = "OPPS Addendum B, October 2026"
# Clinical Laboratory Fee Schedule: national limit amount by HCPCS.
# Page: https://www.cms.gov/medicare/payment/fee-schedules/clinical-laboratory-fee-schedule-clfs/files
clfs_url = "https://www.cms.gov/files/zip/26clabq4.zip"
clfs_release = "CLFS 26CLABQ4 (October 2026)"
max_bytes = 104_857_600
